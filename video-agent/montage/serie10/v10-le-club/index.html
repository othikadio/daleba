    <script>
      const CFG = {"total": 23.7, "scenes": [[0.0, 4.3], [4.3, 4.3], [8.6, 4.3], [12.9, 4.3], [17.2, 6.5]], "style": "deco"}; const STY = CFG.style, T = CFG.total;
      const CUES = []; const cue = (t, file, gain) => CUES.push({ t: +Math.max(0, t).toFixed(3), file: file, gain: gain == null ? .5 : gain });
      document.querySelectorAll(".split").forEach(function (el) {
        el.innerHTML = Array.from(el.textContent).map(function (c) { return c === " " ? '<span class="ch"> </span>' : '<span class="ch">' + c + "</span>"; }).join("");
      });
      // texte trop large → on réduit pour qu'il tienne dans l'écran
      document.querySelectorAll(".big .ln").forEach(function (ln) { const w = ln.scrollWidth, M = 920;

      document.querySelectorAll(".badge").forEach(function (b) { if (b.textContent.length > 2) b.style.fontSize = (STY === "comic" ? 84 : 58) + "px"; });
      const tl = gsap.timeline({ paused: true });
      const S = function (i) { return document.getElementById("s" + i); };
      const q = function (i, sel) { return Array.from(S(i).querySelectorAll(sel)); };
      const st = function (i) { return CFG.scenes[i][0]; }, du = function (i) { return CFG.scenes[i][1]; };
      const N = CFG.scenes.length;
      function from(els, t, vars, to, file, g) {

        tl.set(els, vars, 0);

      }
      // ---------- préréglages par style ----------
      const P = {
        blueprint: { sfx: { big: "type-click.wav", it: "fit_tick_domino.wav", tr: "sweep-small.wav", ph: "shutter.wav", bd: "pop-bubble.wav" },

        brutal: { sfx: { big: "pop-hard.wav", it: "fit_key_thock.wav", tr: "whoosh-fast.wav", ph: "fit_snap_switch_flip.wav", bd: "pop-long.wav" },

          big: function (els, t, box) { tl.set(box, { opacity: 0 }, 0);
            [[0, 1], [.06, .1], [.12, 1], [.2, .3], [.28, 1], [.42, .5], [.5, 1]].forEach(function (p) { tl.set(box, { opacity: p[1] }, t + p[0]); }); cue(t, "glitch_mid.wav", .3); },

          box: function (el, t) { from(el, t, { scale: 0, rotate: 10 }, { scale: 1, rotate: 0, duration: .45, ease: "back.out(2)" }); },
          trans: function (t) { from("#wipe", t - .3, { scale: 0, rotate: 0 }, { scale: 9, rotate: 90, duration: .3, ease: "power3.in" }); tl.to("#wipe", { scale: 0, rotate: 180, duration: .3, ease: "power3.out" }, t); } },
        halftone: { sfx: { big: "pop-bubble.wav", it: "click.wav", tr: "swoosh-wind.wav", ph: "pop-whoosh.wav", bd: "pop-hard.wav" },

          box: function (el, t) { from(el, t, { scale: 0 }, { scale: 1, duration: .55, ease: "back.out(1.6)" }); },
          trans: function (t) { from("#wipe", t - .3, { scale: 0 }, { scale: 12, duration: .3, ease: "power2.in" }); tl.to("#wipe", { scale: 0, duration: .32, ease: "power2.out" }, t); } },

          trans: function (t) { from("#wipe", t - .3, { scale: 0 }, { scale: 12, duration: .3, ease: "power3.in" }); tl.to("#wipe", { scale: 0, duration: .35, ease: "power3.out" }, t); } },
        clay: { sfx: { big: "drip_bloop.wav", it: "pop-bubble.wav", tr: "pop-long.wav", ph: "pop-whoosh.wav", bd: "sparkle.wav" },

          trans: function (t) { from("#wipe", t - .35, { scale: 0 }, { scale: 12, duration: .35, ease: "back.in(1.4)" }); tl.to("#wipe", { scale: 0, duration: .4, ease: "back.out(1.2)" }, t); } },
        glass: { sfx: { big: "woosh-air.wav", it: "click.wav", tr: "whoosh-cine.wav", ph: "sparkle.wav", bd: "tone-correct.wav" },
          big: function (els, t) { from(els, t, { y: 60, opacity: 0, filter: "blur(16px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: .6, ease: "power3.out", stagger: .025 }, "woosh-air.wav", .3); },
          box: function (el, t) { from(el, t, { y: 80, opacity: 0, filter: "blur(20px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: .7, ease: "power3.out" }); },
          trans: function (t, i) { from(S(i), t, { opacity: 0, filter: "blur(30px)", scale: 1.08 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: .55, ease: "power2.out" }); } },
        flap: { sfx: { big: "type-click.wav", it: "fit_tick_domino.wav", tr: "fit_snap_switch_flip.wav", ph: "shutter.wav", bd: "pop-bubble.wav" },
          big: function (els, t) { const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            els.forEach(function (c, k) { const fin = c.textContent; if (fin === " ") return; const o = { p: 0 }; const n = 6 + (k % 5);
              tl.fromTo(o, { p: 0 }, { p: 1, duration: .05 * n, ease: "none", immediateRender: false,
                onUpdate: function () { const s = Math.floor(o.p * n); c.textContent = o.p >= 1 ? fin : A[(k * 7 + s * 11) % A.length]; } }, t + k * .03);
              tl.set(c, { textContent: A[(k * 7) % A.length] }, 0); });
            for (let k = 0; k < 10; k++) cue(t + k * .05, "fit_tick_domino.wav", .22); },
          box: function (el, t) { from(el, t, { rotateX: -90, opacity: 0 }, { rotateX: 0, opacity: 1, duration: .45, ease: "power2.out" }); },
          trans: function (t) { from("#wipe", t - .25, { scaleY: 0 }, { scaleY: 1, duration: .25, ease: "power2.in" }); tl.to("#wipe", { scaleY: 0, duration: .25, ease: "power2.out" }, t); } },
        deco: { sfx: { big: "sparkle.wav", it: "mallet_marimba.wav", tr: "swoosh-wind.wav", ph: "sparkle.wav", bd: "tone-correct.wav" },
          big: function (els, t, box) { from(box, t, { opacity: 0, scaleX: 1.35, y: 20 }, { opacity: 1, scaleX: 1, y: 0, duration: 1.1, ease: "power2.out" }, "sparkle.wav", .3); },
          box: function (el, t) { from(el, t, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .8, ease: "power2.out" }); },
          trans: function (t) { from("#wipe", t - .4, { scaleY: 0 }, { scaleY: 1, duration: .4, ease: "power2.inOut" }); tl.to("#wipe", { scaleY: 0, duration: .45, ease: "power2.inOut" }, t); } },
      };
      const p = P[STY]; const X = p.sfx;
      // ---------- scènes ----------
      for (let i = 0; i < N; i++) {
        const t0 = st(i) + .25; let t = t0;
        const ph = q(i, ".photo")[0], kick = q(i, ".kick")[0], big = q(i, ".big")[0], sub = q(i, ".sub")[0], its = q(i, ".it"), bd = q(i, ".badge")[0], ct = q(i, ".contact")[0], rules = q(i, ".rule");
        if (ph) { p.box(ph, t, 1); cue(t, X.ph, .4); tl.fromTo(ph, { backgroundPositionY: "30%" }, { backgroundPositionY: "60%", duration: du(i), ease: "none", immediateRender: false }, st(i)); t += .3; }
        if (kick) { p.box(kick, t, 0); t += .2; }
        rules.forEach(function (r) { from(r, t, { scaleX: 0 }, { scaleX: 1, duration: .9, ease: "power2.out" }); });
        if (big) { p.big(Array.from(big.querySelectorAll(".ch")), t, big); if (STY !== "flap" && STY !== "blueprint") cue(t, X.big, .35); t += .5; }
        its.forEach(function (it, k) { p.box(it, t + k * .32, k); cue(t + k * .32, X.it, .35); });
        t += its.length * .32;
        if (sub) { p.box(sub, t + .1, 1); t += .3; }
        if (bd) { from(bd, t0 + .9, { scale: 0, rotate: -30 }, { scale: 1, rotate: -8, duration: .5, ease: "back.out(2.2)" }, X.bd, .45);
          tl.to(bd, { rotate: 8, duration: 1.1, yoyo: true, repeat: 3, ease: "sine.inOut" }, t0 + 1.4); }
        if (ct) { p.box(ct, t + .3, 0); cue(t + .3, "notif-positive.wav", .35); tl.to(q(i, ".pill"), { scale: 1.06, duration: .4, yoyo: true, repeat: 7, ease: "sine.inOut" }, t + 1); }
        if (i > 0) { p.trans(st(i), i); cue(st(i) - .3, X.tr, .4); }
      }
      // ---------- fonds animés (signature de chaque style) ----------
      const bg = function (sel, vars) { const el = document.querySelectorAll(sel); if (el.length) tl.to(el, Object.assign({ duration: T, ease: "none" }, vars), 0); };
      bg("#grid", { x: -180, y: -360 }); bg(".ring", { rotate: 120 }); bg("#star", { rotate: 360 });
      bg("#rays", { rotate: STY === "deco" ? 40 : 90 }); bg("#sun", { rotate: 60, scale: 1.15 }); bg("#dots2", { x: 120 });
      bg(".sh.c1", { rotate: 90, x: 60 }); bg(".sh.c2", { rotate: -40 }); bg(".sh.c3", { y: 80 });
      bg(".flake", { y: 260, x: 40 }); bg(".blob.o1", { x: 200, y: 160 }); bg(".blob.o2", { x: -220, y: -120 }); bg(".blob.o3", { x: 160, y: -200 });
      document.querySelectorAll(".ball").forEach(function (b, k) { tl.to(b, { y: k % 2 ? 40 : -40, rotate: k % 2 ? 12 : -12, duration: 1.6 + k * .2, yoyo: true, repeat: Math.ceil(T / (1.6 + k * .2)), ease: "sine.inOut" }, 0); });
      if (document.getElementById("frame")) [3.1, 9.4, 17.2, 26.3].forEach(function (s) { if (s < T) { tl.set("#frame", { opacity: .3 }, s); tl.set("#frame", { opacity: 1 }, s + .07); tl.set("#frame", { opacity: .5 }, s + .14); tl.set("#frame", { opacity: 1 }, s + .2); } });

      window.__cues = CUES;
      window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
